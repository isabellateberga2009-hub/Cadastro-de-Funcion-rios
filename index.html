<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Cadastro de Funcionários</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

    <h1>Cadastro de Funcionários</h1>

    <form>

        <table border="1">

            <tr>
                <th colspan="2">Cadastro de Funcionário</th>
            </tr>

            <!-- 1 - Nome completo -->
            <tr>
                <th>
                    <label for="nome">Nome completo:</label>
                </th>
                <td>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >
                </td>
            </tr>

            <!-- 2 - CPF -->
            <tr>
                <th>
                    <label for="cpf">CPF:</label>
                </th>
                <td>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        required
                    >
                </td>
            </tr>

            <!-- 3 - E-mail -->
            <tr>
                <th>
                    <label for="email">E-mail:</label>
                </th>
                <td>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </td>
            </tr>

            <!-- 4 - Telefone -->
            <tr>
                <th>
                    <label for="telefone">Telefone:</label>
                </th>
                <td>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        required
                    >
                </td>
            </tr>

            <!-- 5 - Data de nascimento -->
            <tr>
                <th>
                    <label for="nascimento">Data de nascimento:</label>
                </th>
                <td>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >
                </td>
            </tr>

            <!-- 6 - Cargo -->
            <tr>
                <th>
                    <label for="cargo">Cargo:</label>
                </th>
                <td>
                    <input
                        type="text"
                        id="cargo"
                        name="cargo"
                        required
                    >
                </td>
            </tr>

            <!-- 7 - Salário -->
            <tr>
                <th>
                    <label for="salario">Salário:</label>
                </th>
                <td>
                    <input
                        type="number"
                        id="salario"
                        name="salario"
                        step="0.01"
                        min="0"
                        required
                    >
                </td>
            </tr>

            <!-- 8 - Setor -->
            <tr>
                <th>
                    <label for="setor">Setor:</label>
                </th>
                <td>
                    <select id="setor" name="setor" required>
                        <option value="">Selecione um setor</option>
                        <option value="rh">Recursos Humanos</option>
                        <option value="ti">Tecnologia da Informação</option>
                        <option value="financeiro">Financeiro</option>
                        <option value="administrativo">Administrativo</option>
                        <option value="producao">Produção</option>
                        <option value="vendas">Vendas</option>
                    </select>
                </td>
            </tr>

            <!-- 9 - Turno -->
            <tr>
                <th>Turno:</th>
                <td>

                    <input
                        type="radio"
                        id="manha"
                        name="turno"
                        value="manha"
                        required
                    >
                    <label for="manha">Manhã</label>

                    <input
                        type="radio"
                        id="tarde"
                        name="turno"
                        value="tarde"
                    >
                    <label for="tarde">Tarde</label>

                    <input
                        type="radio"
                        id="noite"
                        name="turno"
                        value="noite"
                    >
                    <label for="noite">Noite</label>

                </td>
            </tr>

            <!-- 10 - Tipo de contrato -->
            <tr>
                <th>
                    <label for="contrato">Tipo de contrato:</label>
                </th>
                <td>

                    <select
                        id="contrato"
                        name="contrato"
                        required
                    >
                        <option value="">Selecione</option>
                        <option value="clt">CLT</option>
                        <option value="pj">PJ</option>
                        <option value="estagio">Estágio</option>
                        <option value="temporario">Temporário</option>
                        <option value="aprendiz">Jovem Aprendiz</option>
                    </select>

                </td>
            </tr>

            <!-- 11 - Conhecimentos / tecnologias -->
            <tr>
                <th>Conhecimentos / tecnologias:</th>
                <td>

                    <input
                        type="checkbox"
                        id="html"
                        name="tecnologias"
                        value="html"
                    >
                    <label for="html">HTML</label>

                    <input
                        type="checkbox"
                        id="css"
                        name="tecnologias"
                        value="css"
                    >
                    <label for="css">CSS</label>

                    <input
                        type="checkbox"
                        id="javascript"
                        name="tecnologias"
                        value="javascript"
                    >
                    <label for="javascript">JavaScript</label>

                    <input
                        type="checkbox"
                        id="python"
                        name="tecnologias"
                        value="python"
                    >
                    <label for="python">Python</label>

                    <input
                        type="checkbox"
                        id="java"
                        name="tecnologias"
                        value="java"
                    >
                    <label for="java">Java</label>

                </td>
            </tr>

            <!-- 12 - Observações -->
            <tr>
                <th>
                    <label for="observacoes">Observações:</label>
                </th>
                <td>
                    <textarea
                        id="observacoes"
                        name="observacoes"
                        rows="5"
                        cols="40"
                    ></textarea>
                </td>
            </tr>

            <!-- 13 - Aceite dos termos -->
            <tr>
                <th>Aceite dos termos:</th>
                <td>

                    <input
                        type="checkbox"
                        id="termos"
                        name="termos"
                        required
                    >

                    <label for="termos">
                        Aceito os termos e condições
                    </label>

                </td>
            </tr>

            <!-- Botões -->
            <tr>
                <th colspan="2">

                    <button type="submit">
                        Cadastrar
                    </button>

                    <button type="reset">
                        Limpar
                    </button>

                </th>
            </tr>

        </table>

    </form>

</body>

</html>
